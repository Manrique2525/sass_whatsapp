services:
  app:
    build:
      context: .
      target: runtime
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "php", "healthcheck.php"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-default:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "queue:work", "redis", "--queue=default", "--sleep=1", "--tries=3", "--timeout=120"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work.*--queue=default' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-knowledge:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "queue:work", "redis", "--queue=knowledge", "--sleep=1", "--tries=3", "--timeout=300"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work.*--queue=knowledge' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker-analytics:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "queue:work", "redis", "--queue=analytics", "--sleep=1", "--tries=3", "--timeout=300"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work.*--queue=analytics' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  scheduler:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan schedule:work' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  reverb:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: on-failure:5
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug"]
    expose:
      - "8080"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan reverb:start' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      target: web
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: on-failure:5
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
