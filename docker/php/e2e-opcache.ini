; Activa OPcache para el servidor web integrado de PHP (`php artisan serve`),
; que corre en SAPI CLI (por defecto opcache.enable_cli=0, lo que hace que cada
; request re-bootstrapée ~6s).
; Este archivo se monta SOLO en el contenedor e2e (docker-compose.e2e.yml) con
; prefijo `zz-` para que cargue DESPUÉS de docker/php/opcache.ini y lo sobreescriba.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
