; Activa OPcache para PHP-FPM en el entorno E2E.
; Este archivo se monta SOLO en el contenedor e2e (docker-compose.e2e.yml) con
; prefijo `zz-` para que cargue DESPUÉS de docker/php/opcache.ini y lo sobreescriba.
opcache.enable_cli=1
opcache.enable=1
; El código se reconstruye/recrea antes de cada corrida E2E; evitar stat() sobre
; el bind mount de Windows en cada request reduce la latencia de PHP-FPM.
opcache.validate_timestamps=0
opcache.revalidate_freq=0
