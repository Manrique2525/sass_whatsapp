name: whatsapp-saas-e2e

# Entorno E2E (Playwright) — FASE 30 / ADR-110.
#
# Levanta un stack completamente autocontenido, con:
#   - BD dedicada  whatsapp_saas_e2e_test  (guard: debe terminar en _e2e_test)
#   - Redis índice lógico 15 (solo sus llaves)
#   - almacenamiento local aislado (nunca MinIO compartido)
#   - APP_ENV=e2e  (activa guard + fakes deterministas)
#   - servidor HTTP nginx en el puerto 8082 hacia PHP-FPM
#
# Uso:
#   docker compose -f docker-compose.e2e.yml up -d
#   docker compose -f docker-compose.e2e.yml exec e2e-app php artisan e2e:setup
#   npm run test:e2e
#
# El guard E2E aborta cualquier operación destructiva sobre una BD/index que
# no sea la dedicada. NO toca el stack de desarrollo.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # The database is disposable. Avoid host-Docker checkpoint I/O pauses in
    # the long serial E2E run; development PostgreSQL is not affected.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "checkpoint_timeout=30min"]
    environment:
      POSTGRES_DB: whatsapp_saas_e2e_test
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_secret
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d whatsapp_saas_e2e_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - e2e

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis state is disposable and is recreated by e2e:setup.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - e2e

  e2e-app:
    build:
      context: .
      target: runtime
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php-fpm", "-F"]
    volumes:
      - .:/var/www/html
      # Volumen nombrado compartido solo por el proyecto E2E; no depende del host.
      - e2e_storage:/var/www/html/storage/app
      # Activa OPcache para PHP-FPM y acelera las requests del entorno E2E.
      # Carga después de opcache.ini (prefijo zz-).
      - ./docker/php/e2e-opcache.ini:/usr/local/etc/php/conf.d/zz-e2e-opcache.ini:ro
      - ./docker/php/e2e-www.conf:/usr/local/etc/php-fpm.d/www.conf:ro
    environment:
      APP_ENV: e2e
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: whatsapp_saas_e2e_test
      DB_USERNAME: saas
      DB_PASSWORD: saas_secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      REDIS_DB: "15"
      REDIS_CACHE_DB: "15"
      CACHE_STORE: redis
      CACHE_PREFIX: e2e_
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SESSION_SECURE_COOKIE: "false"
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_APP_ID: whatsapp-saas-e2e
      REVERB_APP_KEY: whatsapp-saas-e2e-key
      REVERB_APP_SECRET: whatsapp-saas-e2e-secret
      REVERB_HOST: reverb-e2e
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: "8083"
      VITE_REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: whatsapp-saas-e2e-key
      FILESYSTEM_DISK: local
      KNOWLEDGE_STORAGE_DISK: local
      MAIL_MAILER: array
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_BUCKET: ""
      WHATSAPP_APP_SECRET: ""
      WHATSAPP_VERIFY_TOKEN: ""
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      SENTRY_LARAVEL_DSN: ""
      E2E_TEST_PASSWORD: e2e-password
      REDIS_PREFIX: e2e_
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "healthcheck.php"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 20s
    networks:
      - e2e
      - e2e-realtime

  e2e-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/e2e.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      e2e-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - e2e

  reverb:
    build:
      context: .
      target: runtime
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8083:8080"
    volumes:
      - .:/var/www/html
      - ./docker/php/reverb-e2e-healthcheck.php:/usr/local/bin/reverb-e2e-healthcheck.php:ro
    environment:
      APP_ENV: e2e
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: whatsapp_saas_e2e_test
      DB_USERNAME: saas
      DB_PASSWORD: saas_secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      REDIS_DB: "15"
      REDIS_CACHE_DB: "15"
      CACHE_STORE: redis
      CACHE_PREFIX: e2e_
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_APP_ID: whatsapp-saas-e2e
      REVERB_APP_KEY: whatsapp-saas-e2e-key
      REVERB_APP_SECRET: whatsapp-saas-e2e-secret
      REVERB_HOST: reverb-e2e
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      FILESYSTEM_DISK: local
      KNOWLEDGE_STORAGE_DISK: local
      MAIL_MAILER: array
      SENTRY_LARAVEL_DSN: ""
      REDIS_PREFIX: e2e_
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/reverb-e2e-healthcheck.php"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      e2e: {}
      e2e-realtime:
        aliases:
          - reverb-e2e

  e2e-worker:
    build:
      context: .
      target: runtime
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--queue=default,knowledge", "--sleep=1", "--tries=1", "--max-time=3600"]
    volumes:
      - .:/var/www/html
      - e2e_storage:/var/www/html/storage/app
    environment:
      APP_ENV: e2e
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: whatsapp_saas_e2e_test
      DB_USERNAME: saas
      DB_PASSWORD: saas_secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      REDIS_DB: "15"
      REDIS_CACHE_DB: "15"
      CACHE_STORE: redis
      CACHE_PREFIX: e2e_
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: whatsapp-saas-e2e
      REVERB_APP_KEY: whatsapp-saas-e2e-key
      REVERB_APP_SECRET: whatsapp-saas-e2e-secret
      REVERB_HOST: reverb-e2e
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      FILESYSTEM_DISK: local
      KNOWLEDGE_STORAGE_DISK: local
      MAIL_MAILER: array
      SENTRY_LARAVEL_DSN: ""
      REDIS_PREFIX: e2e_
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      e2e-app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[a]rtisan queue:work' >/dev/null"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 20s
    networks:
      - e2e
      - e2e-realtime

volumes:
  e2e_postgres_data:
  e2e_storage:

networks:
  e2e:
    driver: bridge
  e2e-realtime:
    name: whatsapp-saas-e2e-realtime
