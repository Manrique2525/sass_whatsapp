# docker-compose.coverage.yml
# Coverage runner — dev/test only. Uses the "coverage" build target.
# Usage: docker compose -f docker-compose.yml -f docker-compose.coverage.yml run --rm coverage php vendor/bin/pest --coverage
name: whatsapp-saas

services:
  coverage:
    build:
      context: .
      target: coverage
    image: whatsapp-saas-app:coverage
    pull_policy: build
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      # The default suite is the non-PG suite; PG coverage runs explicitly
      # with phpunit.pgsql.xml and its dedicated database configuration.
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: whatsapp-saas
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      BROADCAST_CONNECTION: null
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-minio:
        condition: service_completed_successfully
    networks:
      - saas
