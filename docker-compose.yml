name: whatsapp-saas

services:
  app:
    build:
      context: .
      target: runtime
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./storage/app:/var/www/html/storage/app
    environment: &app-env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: whatsapp_saas
      DB_USERNAME: saas
      DB_PASSWORD: saas_secret
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      REVERB_APP_ID: whatsapp-saas
      REVERB_APP_KEY: whatsapp-saas-key
      REVERB_APP_SECRET: whatsapp-saas-secret
      REVERB_HOST: localhost
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      FILESYSTEM_DISK: minio
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: whatsapp-saas
      AWS_ENDPOINT: http://minio:9000
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: "no-reply@whatsapp-saas.local"
      MAIL_FROM_NAME: "WhatsApp SaaS"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "healthcheck.php"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - saas

  worker:
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--max-time=3600"]
    volumes:
      - .:/var/www/html
    environment: *app-env
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "healthcheck.php"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - saas

  schedule:
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    environment: *app-env
    depends_on:
      - app
    networks:
      - saas

  reverb:
    image: whatsapp-saas-app
    pull_policy: build
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8081:8080"
    volumes:
      - .:/var/www/html
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saas

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - saas

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp_saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas_secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d whatsapp_saas"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saas

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - saas

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9002:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - saas

  init-minio:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/whatsapp-saas
        echo "minio bucket ready"
    restart: "no"
    networks:
      - saas

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8026:8025"
      - "1026:1025"
    networks:
      - saas

volumes:
  postgres_data:
  minio_data:

networks:
  saas:
    driver: bridge
